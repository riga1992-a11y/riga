        // Efek Suara Ramah Anak menggunakan Web Audio API
        const playBeep = (freq, duration, type = 'sine') => {
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = type;
            oscillator.frequency.value = freq;
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
          } catch (e) {}
        };

        const playSuccessSound = () => {
          playBeep(523.25, 0.15, 'triangle'); // C5
          setTimeout(() => playBeep(659.25, 0.15, 'triangle'), 100); // E5
          setTimeout(() => playBeep(783.99, 0.3, 'triangle'), 200); // G5
        };

          ]);

          const [notifikasiBerhasil, setNotifikasiBerhasil] = useState(false);

          const navigasiKe = (layarBaru) => {
            playClickSound();
            setLayar(layarBaru);
          };

          const resetKuis = () => {
            setIndeksKuis(0);
            setItemTerpilihKuis([]);
            setJawabanTerpilih(null);
            setKuisDiverifikasi(false);
            setKuisBenar(false);
            setBintangKuis(0);
            setSkorTersimpan(false);
          };

          const tanganiKetukKuis = (id) => {
            playClickSound();
            if (kuisDiverifikasi) return;

            if (itemTerpilihKuis.includes(id)) {
              setItemTerpilihKuis(itemTerpilihKuis.filter(item => item !== id));
            } else {
              setItemTerpilihKuis([...itemTerpilihKuis, id]);
            }
          };

          const verifikasiJawabanKuis = () => {
            const soal = QUIZ_QUESTIONS[indeksKuis];
            let hasilBenar = false;

            if (soal.tipe === 'ketuk-titik-sudut' || soal.tipe === 'ketuk-sisi') {
              if (itemTerpilihKuis.length === soal.targetCount) {
                hasilBenar = true;
              }
            } else if (soal.tipe === 'misteri-detektif') {
              const opsiDipilih = soal.pilihan.find(p => p.id === jawabanTerpilih);
              if (opsiDipilih && opsiDipilih.benar) {
                hasilBenar = true;
              }
            }

            setKuisBenar(hasilBenar);
            setKuisDiverifikasi(true);

            if (hasilBenar) {
              playSuccessSound();
              setBintangKuis(prev => prev + 1);
            } else {
              playFailSound();
            }
          };

          const lanjutKuis = () => {
            playClickSound();
            if (indeksKuis + 1 < QUIZ_QUESTIONS.length) {
              setIndeksKuis(indeksKuis + 1);
              setItemTerpilihKuis([]);
              setJawabanTerpilih(null);
              setKuisDiverifikasi(false);
              setKuisBenar(false);

                            <div className="flex gap-2 text-xs">
                              <span className="w-5 h-5 bg-rose-100 text-rose-600 font-bold rounded-full flex items-center justify-center flex-shrink-0">3</span>
                              <p className="text-slate-600"><strong className="text-slate-800">Titik Sudut:</strong> Ujung paling lancip di bagian pojokan luar.</p>
                            </div>
                          </div>
                        ) : (
                          <div className="grid gap-2">
                            {bangunTerpilih.bendaNyata.map((benda, idx) => (
                              <div key={idx} className="bg-slate-50 p-2.5 rounded-xl flex items-center gap-3 border border-slate-100">
                                <span className="text-2xl p-1 bg-white rounded-lg shadow-sm">{benda.icon}</span>
                                <div>
                                  <h4 className="font-extrabold text-xs text-slate-800">{benda.nama}</h4>
                                  <p className="text-[10px] text-slate-400">{benda.deskripsi}</p>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                  <div className="mt-4 flex justify-between items-center bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm">
                    <p className="text-[10px] text-slate-400">Belajar: <strong className="text-slate-600">{bangunTerpilih.nama}</strong></p>
                    <button
                      onClick={() => {
                        resetKuis();
                        navigasiKe('kuis');
                      }}
                      className="bg-emerald-400 hover:bg-emerald-500 text-white font-extrabold text-xs py-2 px-4 rounded-xl shadow-sm flex items-center gap-1.5"
                    >
                      Uji Kemampuan di Kuis <ArrowRightIcon className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              )}

              {/* 4. LAYAR KUIS PINTAR */}
              {layar === 'kuis' && (
                <div className="flex-1 max-w-2xl mx-auto w-full p-4 flex flex-col justify-between">
                  <div className="bg-white p-3 rounded-2xl border border-slate-100 flex items-center justify-between mb-4">
                    <button 
                      onClick={() => navigasiKe('peta')}
                      className="text-xs font-bold text-slate-400 hover:text-slate-600 flex items-center gap-1"
                    >
                      <ArrowLeftIcon className="w-3.5 h-3.5" /> Keluar
                    </button>

                    <div className="flex items-center gap-1.5">
                      <span className="text-[10px] font-black text-slate-400 uppercase">Soal {indeksKuis + 1}/{QUIZ_QUESTIONS.length}</span>
                      <div className="w-16 bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div 
                          className="bg-emerald-400 h-full transition-all"
                          style={{ width: `${((indeksKuis + 1) / QUIZ_QUESTIONS.length) * 100}%` }}
                        />
                      </div>
                    </div>

                    <div className="flex items-center gap-1 bg-yellow-100 px-2 py-0.5 rounded-full text-yellow-800 font-extrabold text-xs">
                      <StarIcon className="w-3.5 h-3.5 fill-yellow-500 stroke-yellow-600" />
                      <span>{bintangKuis}</span>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm flex-1 flex flex-col justify-center text-left">
                    <div className="flex items-start gap-3 mb-4 bg-blue-50/70 p-3.5 rounded-2xl border border-blue-100 text-xs">
                      <span className="text-2xl flex-shrink-0">🕵️‍♂️</span>
                      <div>
                        <h4 className="font-extrabold text-slate-700">Misteri Ke-{indeksKuis + 1}</h4>
                        <p className="text-slate-600 mt-0.5 leading-relaxed">{QUIZ_QUESTIONS[indeksKuis].pertanyaan}</p>
                      </div>
                    </div>

                    {(QUIZ_QUESTIONS[indeksKuis].tipe === 'ketuk-titik-sudut' || QUIZ_QUESTIONS[indeksKuis].tipe === 'ketuk-sisi') && (
                      <div className="flex flex-col items-center justify-center my-3">
                        {renderVisualBangun(
                          SHAPES_DATA.find(s => s.id === QUIZ_QUESTIONS[indeksKuis].bangunId),
                          true,
                          true,
                          QUIZ_QUESTIONS[indeksKuis].tipe
                        )}

                        <div className="mt-3 text-center">
                          <p className="text-[10px] text-slate-400">{QUIZ_QUESTIONS[indeksKuis].instruksiKhusus}</p>
                          
                          <div className="mt-2 flex items-center justify-center gap-1 bg-slate-50 px-3 py-1 rounded-xl border border-slate-100">
                            <span className="text-[10px] font-bold text-slate-400 uppercase">Ditemukan:</span>
                            <strong className="text-xs text-blue-600 font-black">
                              {itemTerpilihKuis.length} / {QUIZ_QUESTIONS[indeksKuis].targetCount}
                            </strong>
                          </div>

                          {QUIZ_QUESTIONS[indeksKuis].bangunId === 'lingkaran' && QUIZ_QUESTIONS[indeksKuis].tipe === 'ketuk-titik-sudut' && (
                            <button
                              onClick={() => {
                                playClickSound();
                                setItemTerpilihKuis([]);
                                verifikasiJawabanKuis();
                              }}
                              disabled={kuisDiverifikasi}
                              className="mt-3 px-5 py-2.5 bg-rose-500 hover:bg-rose-600 disabled:opacity-50 text-white font-extrabold text-xs rounded-xl shadow transition"
                            >
                              Tidak Ada Titik Sudut ⭕
                            </button>
                          )}
                        </div>
                      </div>
                    )}

                    {QUIZ_QUESTIONS[indeksKuis].tipe === 'misteri-detektif' && (
                      <div className="space-y-2.5 my-3">
                        {QUIZ_QUESTIONS[indeksKuis].pilihan.map((opsi) => {
                          const isSelected = jawabanTerpilih === opsi.id;
                          let btnStyle = "bg-white hover:bg-slate-50 border-slate-200 text-slate-700";
                          
                          if (isSelected) btnStyle = "bg-yellow-100 border-yellow-400 text-yellow-900";
                          if (kuisDiverifikasi) {
                            if (opsi.benar) btnStyle = "bg-emerald-100 border-emerald-400 text-emerald-900";
                            else if (isSelected && !opsi.benar) btnStyle = "bg-rose-100 border-rose-400 text-rose-900";
                          }

                          return (
                            <button
                              key={opsi.id}
                              onClick={() => {
                                if (kuisDiverifikasi) return;
                                playClickSound();
                                setJawabanTerpilih(opsi.id);
                              }}
                              disabled={kuisDiverifikasi}
                              className={`w-full p-3 rounded-xl border-2 text-left font-bold text-xs md:text-sm transition flex items-center justify-between ${btnStyle}`}
                            >
                              <span>{opsi.text}</span>
                              {kuisDiverifikasi && opsi.benar && <CheckCircleIcon className="w-4 h-4 text-emerald-600" />}
                              {kuisDiverifikasi && isSelected && !opsi.benar && <XCircleIcon className="w-4 h-4 text-rose-600" />}
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {kuisDiverifikasi && (
                      <div className={`mt-4 p-3 rounded-xl border-2 text-xs ${
                        kuisBenar ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'
                      }`}>
                        <div className="font-extrabold flex items-center gap-1.5">
                          {kuisBenar ? '🎉 Masya Allah, Benar!' : '💡 Coba Periksa Lagi, Detektif!'}
                        </div>
                        <p className="opacity-90 mt-1">
                          {QUIZ_QUESTIONS[indeksKuis].tipe === 'misteri-detektif'
                            ? (kuisBenar ? QUIZ_QUESTIONS[indeksKuis].umpanBalikBenar : QUIZ_QUESTIONS[indeksKuis].umpanBalikSalah)
                            : (kuisBenar 
                                ? `Sempurna! Kamu berhasil menandai semua bagian dengan sangat presisi.` 
                                : `Jumlah ketukanmu belum tepat. Harus ada ${QUIZ_QUESTIONS[indeksKuis].targetCount} ketukan.`
                              )
                          }
                        </p>
                      </div>
                    )}
                  </div>

                  <div className="mt-4 flex items-center justify-end gap-2.5">
                    <button
                      onClick={() => {
                        playClickSound();
                        setBantuanTerbuka(true);
                      }}
                      className="bg-yellow-50 hover:bg-yellow-100 border border-yellow-200 text-yellow-800 p-2.5 rounded-xl text-xs font-bold transition flex items-center gap-1"
                    >
                      <HelpCircleIcon className="w-4 h-4" /> Bantuan
                    </button>

                    {!kuisDiverifikasi ? (
                      <button
                        onClick={verifikasiJawabanKuis}
                        disabled={
                          (QUIZ_QUESTIONS[indeksKuis].tipe === 'ketuk-titik-sudut' && QUIZ_QUESTIONS[indeksKuis].bangunId !== 'lingkaran' && itemTerpilihKuis.length === 0) ||
                          (QUIZ_QUESTIONS[indeksKuis].tipe === 'ketuk-sisi' && itemTerpilihKuis.length === 0) ||
                          (QUIZ_QUESTIONS[indeksKuis].tipe === 'misteri-detektif' && !jawabanTerpilih)
                        }
                        className="bg-blue-500 hover:bg-blue-600 disabled:opacity-50 text-white font-extrabold text-xs md:text-sm py-2.5 px-5 rounded-xl shadow-sm transition"
                      >
                        Periksa Jawaban
                      </button>
                    ) : (
                      <button
                        onClick={lanjutKuis}
                        className="bg-emerald-400 hover:bg-emerald-500 text-white font-extrabold text-xs md:text-sm py-2.5 px-5 rounded-xl shadow-sm transition flex items-center gap-1.5"
                      >
                        {indeksKuis + 1 === QUIZ_QUESTIONS.length ? 'Lihat Lencana' : 'Kasus Selanjutnya'} <ArrowRightIcon className="w-4 h-4" />
                      </button>
                    )}
                  </div>

                  {bantuanTerbuka && (
                    <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                      <div className="bg-white rounded-3xl p-5 max-w-sm w-full border-4 border-yellow-300 text-left relative animate-in zoom-in-95">
                        <h4 className="font-black text-slate-800 text-sm mb-2 flex items-center gap-1.5">
                          <SmileIcon className="text-yellow-500" /> Petunjuk Detektif Dino
                        </h4>
                        <div className="text-xs text-slate-600 space-y-2 leading-relaxed">
                          {QUIZ_QUESTIONS[indeksKuis].tipe === 'ketuk-titik-sudut' && (
                            <p>Temukan bagian pojokan paling luar yang berbentuk tajam. Setiap bentuk (kecuali lingkaran) memiliki pojok luar yang runcing.</p>
                          )}
                          {QUIZ_QUESTIONS[indeksKuis].tipe === 'ketuk-sisi' && (
                            <p>Sisi adalah tepi berupa garis pembatas luar. Ketuklah setiap garis yang membingkai bangun datar tersebut.</p>
                          )}
                          {QUIZ_QUESTIONS[indeksKuis].tipe === 'misteri-detektif' && (
                            <p>Gunakan petunjuk jumlah pojok tajam dan kesamaan panjang sisi untuk menemukan nama bangun datar yang dimaksud.</p>
                          )}
                        </div>
                        <button
                          onClick={() => {
                            playClickSound();
                            setBantuanTerbuka(false);
                          }}
                          className="mt-4 w-full bg-slate-800 hover:bg-slate-700 text-white font-extrabold py-2 rounded-xl text-xs transition"
                        >
                          Saya Siap!
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* 5. LAYAR SERTIFIKAT */}
              {layar === 'sertifikat' && (
                <div className="flex-1 max-w-lg mx-auto w-full p-4 flex flex-col items-center justify-center text-center">
                  <div className="bg-white border-4 border-yellow-300 rounded-3xl p-5 w-full shadow-lg relative overflow-hidden mb-5">
                    <div className="absolute top-0 inset-x-0 h-2.5 bg-gradient-to-r from-blue-400 via-yellow-400 to-emerald-400" />

                    <div className="my-4 animate-bounce">
                      <span className="text-5xl">🏆</span>
                    </div>

                    <span className="text-[10px] font-black text-slate-400 tracking-widest uppercase block mb-1">
                      Piagam Penghargaan Detektif
                    </span>
                    <h2 className="text-xl font-black text-slate-800">
                      Ahli Bangun Datar Cilik
                    </h2>
                    
                    <div className="flex items-center justify-center gap-1.5 mt-1 text-emerald-600 font-extrabold text-xs">
                      <SchoolIcon className="w-4 h-4" />
                      <span>{namaSekolah || 'Madrasah Hebat'}</span>
                    </div>

                    <div className="border-b-2 border-dashed border-slate-100 py-3.5 my-4">
                      <p className="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Diberikan Kepada:</p>
                      <h3 className="text-2xl font-black text-blue-600 uppercase mt-1">
                        {detektifNama || 'Detektif Hebat'}
                      </h3>
                    </div>

                    <div className="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-100 mb-4 text-xs">
                      <div>
                        <strong className="block text-[9px] uppercase text-slate-400">Kasus Selesai</strong>
                        <p className="font-black text-slate-700">{QUIZ_QUESTIONS.length} Kasus</p>
                      </div>
                      <div>
                        <strong className="block text-[9px] uppercase text-slate-400">Total Bintang</strong>
                        <p className="font-black text-yellow-600 flex items-center justify-center gap-1">
                          <StarIcon className="w-3.5 h-3.5 fill-yellow-500 stroke-yellow-600" /> {bintangKuis} / {QUIZ_QUESTIONS.length}
                        </p>
                      </div>
                    </div>

                    <p className="text-xs text-slate-400 italic leading-relaxed px-4">
                      "Barakallah fii ilmik! Kamu telah berhasil menelusuri Sisi, Sudut, dan Titik Sudut secara detail dan luar biasa!"
                    </p>
                  </div>

                  <div className="space-y-2 w-full">
                    <button
                      onClick={simpanSkorDetektif}
                      disabled={skorTersimpan}
                      className={`w-full py-3.5 px-6 rounded-2xl font-black text-xs md:text-sm shadow-md transition flex items-center justify-center gap-2 ${
                        skorTersimpan 
                          ? 'bg-slate-100 text-slate-400 border border-slate-200 cursor-not-allowed' 
                          : 'bg-yellow-300 hover:bg-yellow-400 text-yellow-900 border-b-4 border-yellow-500 active:border-b-0'
                      }`}
                    >
                      <SaveIcon className="w-4 h-4" /> 
                      {skorTersimpan ? 'Skor Berhasil Disimpan!' : 'Simpan Skor ke Papan Prestasi 💾'}
                    </button>

                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => {
                          resetKuis();
                          navigasiKe('peta');
                        }}
                        className="bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-600 font-extrabold py-3.5 px-4 rounded-2xl text-xs transition flex items-center justify-center gap-1"
                      >
                        <RefreshCwIcon className="w-3.5 h-3.5" /> Ulangi Kuis
                      </button>
                      <button
                        onClick={() => navigasiKe('papan-prestasi')}
                        className="bg-slate-800 hover:bg-slate-700 text-white font-extrabold py-3.5 px-4 rounded-2xl text-xs transition flex items-center justify-center gap-1"
                      >
                        <TrophyIcon className="w-3.5 h-3.5 text-yellow-400" /> Papan Skor
                      </button>
                    </div>
                  </div>

                  {notifikasiBerhasil && (
                    <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                      <div className="bg-white rounded-3xl p-5 max-w-sm w-full border-4 border-emerald-400 text-center relative animate-in zoom-in-95">
                        <span className="text-4xl block mb-2">🎉</span>
                        <h4 className="font-extrabold text-slate-800 text-sm mb-1">Berhasil Disimpan!</h4>
                        <p className="text-xs text-slate-500 leading-relaxed mb-4">
                          Skor atas nama <strong className="text-blue-600">{detektifNama}</strong> dari <strong className="text-emerald-600">{namaSekolah}</strong> sudah masuk ke Papan Prestasi Detektif!
                        </p>
                        <button
                          onClick={() => {
                            playClickSound();
                            setNotifikasiBerhasil(false);
                          }}
                          className="w-full bg-emerald-400 hover:bg-emerald-500 text-white font-extrabold py-2 rounded-xl text-xs transition"
                        >
                          Alhamdulillah, Mantap! 👍
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* 6. LAYAR PAPAN PRESTASI */}
              {layar === 'papan-prestasi' && (
                <div className="flex-1 max-w-md mx-auto w-full p-4 flex flex-col justify-between">
                  <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm flex-1 flex flex-col">
                    <div className="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
                      <h3 className="font-black text-slate-800 text-base flex items-center gap-1.5">
                        <TrophyIcon className="w-5 h-5 text-yellow-500" /> Papan Prestasi Detektif
                      </h3>
                      <button
                        onClick={() => navigasiKe('beranda')}
                        className="text-slate-400 hover:text-slate-600 font-bold text-xs flex items-center gap-0.5"
                      >
                        <ArrowLeftIcon className="w-3.5 h-3.5" /> Beranda
                      </button>
                    </div>

                    <div className="space-y-2.5 overflow-y-auto max-h-[360px] pr-1 flex-1 text-left">
                      {daftarSkor.map((skor, index) => (
                        <div 
                          key={index} 
                          className={`p-3 rounded-2xl border flex items-center justify-between transition ${
                            skor.nama === detektifNama && skor.sekolah === namaSekolah
                              ? 'bg-yellow-50 border-yellow-300' 
                              : 'bg-slate-50/50 border-slate-100'
                          }`}
                        >
                          <div className="flex items-center gap-2.5">
                            <span className={`w-6 h-6 rounded-lg font-black text-xs flex items-center justify-center ${
                              index === 0 ? 'bg-yellow-400 text-yellow-900' :
                              index === 1 ? 'bg-slate-200 text-slate-700' :
                              index === 2 ? 'bg-orange-100 text-orange-800' : 'bg-slate-100 text-slate-500'
                            }`}>
                              {index + 1}
                            </span>
                            
                            <div>
                              <h4 className="font-extrabold text-xs text-slate-800 flex items-center gap-1">
                                {skor.nama}
                                {skor.nama === detektifNama && skor.sekolah === namaSekolah && (
                                  <span className="text-[8px] bg-yellow-200 text-yellow-800 px-1 py-0.5 rounded font-black uppercase">Kamu</span>
                                )}
                              </h4>
                              <p className="text-[9px] text-slate-400 flex items-center gap-0.5 mt-0.5">
                                <SchoolIcon className="w-2.5 h-2.5 text-emerald-500" /> {skor.sekolah}
                              </p>
                            </div>
                          </div>

                          <div className="text-right">
                            <span className="inline-flex items-center gap-0.5 bg-yellow-100 text-yellow-800 font-black text-xs px-2 py-0.5 rounded-full">
                              ⭐ {skor.bintang}
                            </span>
                            <p className="text-[8px] text-slate-300 mt-0.5 flex items-center gap-0.5 justify-end">
                              <CalendarIcon className="w-2 h-2" /> {skor.tanggal}
                            </p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <button
                    onClick={() => navigasiKe('beranda')}
                    className="mt-4 w-full bg-emerald-400 hover:bg-emerald-500 text-white font-extrabold py-3 rounded-2xl text-xs shadow transition"
                  >
                    Kembali Main & Pecahkan Kasus 🚀
                  </button>
                </div>
              )}
            </div>
          );
        }

        // Render aplikasi ke DOM root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
